name: CI

on:
  pull_request:
    branches: [main, 'sec-*', 'stabilize/dependencies-local-env']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opostest_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: opostest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opostest_test -d opostest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres-rel01:
        image: postgres:17
        env:
          POSTGRES_USER: rel01_test
          POSTGRES_PASSWORD: rel01_ci_test_password
          POSTGRES_DB: rel01_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rel01_test -d rel01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://opostest_test:ci_test_password@127.0.0.1:5432/opostest_test
      REL01_DATABASE_URL: postgresql://rel01_test:rel01_ci_test_password@127.0.0.1:5433/rel01_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: REL-01 real API and PostgreSQL flows
        run: npm run test:rel01
